version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ondc_buyer_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ondc_buyer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ondc_buyer"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ondc_buyer_backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ondc_buyer
      - POSTGRES_PORT=5432
      - SECRET_KEY=supersecretkeychangeinproduction
    volumes:
      - ./backend:/workspace
      - /workspace/.venv
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
